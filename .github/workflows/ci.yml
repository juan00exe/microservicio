name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint y tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: productos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d productos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/productos_test?sslmode=disable

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verificar formato (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verificar go.mod / go.sum
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: Tests (memoria + PostgreSQL)
        run: go test -race -count=1 -v ./...

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: docker build
        run: docker build -t microservicio:ci .
