openapi: 3.0.3
info:
  title: Microservicio de productos
  description: |
    CRUD REST de productos con autenticación JWT.

    Las lecturas son públicas. Para crear, editar o borrar productos hace falta un token de **admin**:
    haz login en `POST /auth/login`, copia `access_token` y pégalo en **Authorize**.
  version: 1.0.0
servers:
  - url: /
# Por defecto las operaciones son públicas; las protegidas declaran bearerAuth.
security: []
tags:
  - name: auth
    description: Registro, login y perfil
  - name: products
    description: Gestión de productos
  - name: health
    description: Estado del servicio
paths:
  /health:
    get:
      tags: [health]
      summary: Estado del servicio y de la base de datos
      operationId: getHealth
      responses:
        "200":
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "503":
          description: La base de datos no responde
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: unavailable }
                  database: { type: string, example: down }
  /auth/register:
    post:
      tags: [auth]
      summary: Registrar usuario
      operationId: register
      description: Crea una cuenta con rol **user** (solo lectura de productos).
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "201":
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: El email ya está registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: email already registered }
  /auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión
      operationId: login
      requestBody:
        $ref: "#/components/requestBodies/Credentials"
      responses:
        "200":
          description: Login correcto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Email o contraseña incorrectos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: invalid email or password }
  /auth/me:
    get:
      tags: [auth]
      summary: Usuario actual
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Datos del usuario del token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /products:
    get:
      tags: [products]
      summary: Listar productos
      operationId: listProducts
      description: Devuelve los productos paginados, ordenados por fecha de creación.
      parameters:
        - name: page
          in: query
          description: Número de página (empieza en 1)
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Productos por página
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: name
          in: query
          description: Filtra por nombre (contiene el texto, sin distinguir mayúsculas)
          schema: { type: string, example: teclado }
      responses:
        "200":
          description: Página de productos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [products]
      summary: Crear producto
      operationId: createProduct
      description: Requiere rol admin.
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/ProductInput"
      responses:
        "201":
          description: Producto creado
          headers:
            Location:
              description: URL del nuevo producto
              schema: { type: string, example: /products/3f1c2b9e-8a4d-4c1e-9b7a-2d5e6f708192 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID del producto (UUID)
        schema: { type: string, format: uuid }
    get:
      tags: [products]
      summary: Obtener producto
      operationId: getProduct
      responses:
        "200":
          description: Producto encontrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [products]
      summary: Actualizar producto
      operationId: updateProduct
      description: Reemplaza todos los campos editables del producto. Requiere rol admin.
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/ProductInput"
      responses:
        "200":
          description: Producto actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [products]
      summary: Borrar producto
      operationId: deleteProduct
      description: Requiere rol admin.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Producto borrado
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@example.com }
        password: { type: string, format: password, minLength: 8, maxLength: 72, example: admin12345 }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, example: ana@example.com }
        role: { type: string, enum: [admin, user], example: user }
        created_at: { type: string, format: date-time }
    Token:
      type: object
      properties:
        access_token: { type: string, example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9... }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Segundos hasta que el token expira, example: 3600 }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid, example: 3f1c2b9e-8a4d-4c1e-9b7a-2d5e6f708192 }
        name: { type: string, example: Teclado }
        description: { type: string, example: Teclado mecánico }
        price: { type: number, format: double, example: 49.9 }
        stock: { type: integer, example: 10 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, description: Total de productos que cumplen el filtro, example: 42 }
        total_pages: { type: integer, example: 3 }
    ProductInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, example: Teclado }
        description: { type: string, example: Teclado mecánico }
        price: { type: number, format: double, minimum: 0, example: 49.9 }
        stock: { type: integer, minimum: 0, example: 10 }
    Error:
      type: object
      properties:
        error: { type: string }
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Credentials" }
    ProductInput:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProductInput" }
  responses:
    BadRequest:
      description: Cuerpo inválido o datos que no cumplen la validación
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: name is required }
    NotFound:
      description: El producto no existe
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: product not found }
    Unauthorized:
      description: Falta el token o no es válido / ha expirado
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer realm="microservicio" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: missing bearer token }
    Forbidden:
      description: El token es válido pero el usuario no es admin
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: requires role admin }
